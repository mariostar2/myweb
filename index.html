<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마지막 신호 - 인트로</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: #03040a;
            color: #ffffff;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 1. 전체 화면 배경 이미지 */
        .full-bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            object-position: center;
            z-index: 0;
            filter: brightness(0.7) contrast(1.1);
        }

        /* 어두운 분위기 오버레이 (붉은 톤과 어두운 아포칼립스 감성 부여) */
        .bg-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.4) 0%, rgba(3, 4, 10, 0.85) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* 자바스크립트 별빛 Canvas 레이어 */
        #starCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* 고정 인트로 카드 컨테이너 */
        .intro-card {
            position: relative;
            text-align: center;
            background: rgba(15, 12, 28, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 50px 50px;
            border-radius: 32px;
            border: 1px solid rgba(244, 114, 182, 0.25);
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.85),
                0 0 50px rgba(244, 63, 94, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            z-index: 10;
            max-width: 500px;
            width: 90%;
        }

        /* 제목 */
        .intro-title {
            font-size: 25px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 14px;
            background: linear-gradient(135deg, #ffffff 0%, #fecdd3 50%, #fb7185 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 25px rgba(244, 63, 94, 0.3);
        }

        /* 부제목 (타이핑 효과 커서) */
        .intro-subtext {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.7;
            margin-bottom: 36px;
            min-height: 48px; /* 2줄 고려 높이 지정 */
            word-break: keep-all;
        }

        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 14px;
            background-color: #fb7185;
            margin-left: 2px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        /* 링크 스타일 */
        .btn-link {
            text-decoration: none;
            display: inline-block;
            width: 100%;
        }

        /* 마지막 신호 전달 버튼 */
        .shooting-star-btn {
            position: relative;
            width: 100%;
            padding: 16px 28px;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            background: rgba(15, 23, 42, 0.8);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }

        /* 버튼 회전 애니메이션 빛줄기 */
        .shooting-star-btn::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(
                transparent,
                transparent,
                transparent,
                #f43f5e,
                #ffffff
            );
            animation: rotateStar 3s linear infinite;
            z-index: 1;
        }

        /* 버튼 내부 마스크 Layer */
        .shooting-star-btn::after {
            content: '';
            position: absolute;
            inset: 2px;
            background: linear-gradient(135deg, #181825 0%, #2a1220 100%);
            border-radius: 48px;
            z-index: 2;
            transition: background 0.3s ease;
        }

        /* 버튼 텍스트 컨텐츠 */
        .btn-content {
            position: relative;
            z-index: 3;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #ffffff, #fecdd3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 버튼 호버 효과 */
        .shooting-star-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 15px 35px rgba(244, 63, 94, 0.4);
        }

        .shooting-star-btn:hover::after {
            background: linear-gradient(135deg, #2a1220 0%, #881337 100%);
        }

        @keyframes rotateStar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 1. 전체 화면 배경 이미지 -->
    <img src="image/image01.jpeg" alt="마지막 순간의 밤하늘" class="full-bg-image">
    <div class="bg-overlay"></div>

    <!-- 2. 자바스크립트 별빛 & 파티클 Canvas -->
    <canvas id="starCanvas"></canvas>

    <!-- 3. 카드 컨테이너 -->
    <div class="intro-card">
        <h1 class="intro-title">모든 것이 사라지기 전, 너에게</h1>
        <p class="intro-subtext"><span id="typedText"></span><span class="typing-cursor"></span></p>

        <a href="lecture4.html" class="btn-link" id="startBtnLink">
            <button class="shooting-star-btn" id="startBtn">
                <span class="btn-content">마지막 신호 열어보기 ♥</span>
            </button>
        </a>
    </div>

    <!-- 자바스크립트 연출 코드 -->
    <script>
        // -------------------------------------------------------------
        // 1. Canvas 렌더링 : 밤하늘 별빛과 흩날리는 마지막 자국
        // -------------------------------------------------------------
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const stars = [];
        const STAR_COUNT = 100;

        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.005,
                growing: Math.random() > 0.5
            });
        }

        let clickParticles = [];

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 별빛 업데이트 & 그리기
            stars.forEach(star => {
                if (star.growing) {
                    star.alpha += star.speed;
                    if (star.alpha >= 1) star.growing = false;
                } else {
                    star.alpha -= star.speed;
                    if (star.alpha <= 0.1) star.growing = true;
                }

                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(254, 205, 211, ${star.alpha})`;
                ctx.fill();
            });

            // 클릭 시 흩어지는 마음의 파티클
            clickParticles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.025;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(244, 63, 94, ${p.alpha})`;
                ctx.fill();

                if (p.alpha <= 0) clickParticles.splice(index, 1);
            });

            requestAnimationFrame(animate);
        }
        animate();

        // -------------------------------------------------------------
        // 2. 부제목 애틋한 타이핑 애니메이션
        // -------------------------------------------------------------
        const textToType = "세상이 멈추기 전, 꼭 너에게 남기고 싶었던 말이 있어.";
        const typedTextElem = document.getElementById('typedText');
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < textToType.length) {
                typedTextElem.textContent += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 80);
            }
        }
        setTimeout(typeWriter, 400);

        // -------------------------------------------------------------
        // 3. 버튼 클릭 시 마지막 파티클 연출 후 다음 페이지 이동
        // -------------------------------------------------------------
        const startBtnLink = document.getElementById('startBtnLink');

        startBtnLink.addEventListener('click', (e) => {
            e.preventDefault();

            const rect = e.target.getBoundingClientRect();
            const startX = e.clientX || (rect.left + rect.width / 2);
            const startY = e.clientY || (rect.top + rect.height / 2);

            for (let i = 0; i < 40; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                clickParticles.push({
                    x: startX,
                    y: startY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 3 + 1,
                    alpha: 1
                });
            }

            setTimeout(() => {
                window.location.href = startBtnLink.href;
            }, 350);
        });
    </script>

</body>
</html>
